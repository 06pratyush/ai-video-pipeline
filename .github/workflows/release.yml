name: Release

on:
  push:
    tags:
      - 'v*'

# Builds only read the repository; the single publish job below is the one that writes the release.
permissions:
  contents: read

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Setup Python (for bundled bootstrap test)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Type check
        working-directory: app/frontend
        run: npm run typecheck

      # The build scripts pass --publish never: electron-builder only packages, and the
      # publish job uploads everything once all three platforms have built.
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: app/frontend
        run: npm run build:win

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: app/frontend
        run: npm run build:linux

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: app/frontend
        run: npm run build:mac
        env:
          # Unsigned until certificates are configured; stops electron-builder hunting for one.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Code signing (uncomment when certs are configured)
          # CSC_LINK: ${{ secrets.MAC_CERT_BASE64 }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Keep the installers for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            app/frontend/release/*.exe
            app/frontend/release/*.AppImage
            app/frontend/release/*.deb
            app/frontend/release/*.dmg
            app/frontend/release/*.zip

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: List installers
        run: ls -la installers

      - name: Create the release with the installers
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          generate_release_notes: true
